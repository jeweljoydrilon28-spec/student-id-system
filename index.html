<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID Card System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script type="module">
  // IMPORT FIREBASE
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyBqFBQgFeW805kRW50cUJqBYxg5lDMxmP3M",
    authDomain: "student-id-system-1f668.firebaseapp.com",
    projectId: "student-id-system-1f668",
    storageBucket: "student-id-system-1f668.appspot.com",
    messagingSenderId: "1076930946158",
    appId: "1:1076930946158:web:3c9057ec541c9f8144f27f",
    measurementId: "G-DNBR1YC1DC"
  };

  // START FIREBASE
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const studentsRef = collection(db, "students");

  // AUTO LOAD SA TABLE
  onSnapshot(studentsRef, (snapshot) => {
    let total = 0;
    const tableBody = document.querySelector("tbody"); 
    if(!tableBody) return;
    tableBody.innerHTML = "";
    
    snapshot.forEach((docSnap) => {
      const s = docSnap.data();
      total++;
      tableBody.innerHTML += `
        <tr>
          <td><img src="${s.photo_url || ''}" width="40" height="40" style="border-radius:50%;"></td>
          <td>${s.student_id || ''}</td>
          <td>${s.last_name || ''}, ${s.first_name || ''}</td>
          <td>${s.grade || ''} - ${s.section || ''}</td>
          <td>${s.school_year || ''}</td>
          <td>
            <button onclick="alert('Print ID: ${docSnap.id}')">Print ID</button>
            <button onclick="alert('Edit: ${docSnap.id}')">Edit</button>
            <button onclick="deleteStudent('${docSnap.id}')">Delete</button>
          </td>
        </tr>
      `;
    });
    const totalEl = document.querySelector(".card h1");
    if(totalEl) totalEl.innerText = total;
  });

  // DELETE FUNCTION
  window.deleteStudent = async function(id) {
    if(confirm("Delete this student?")) {
      await deleteDoc(doc(db, "students", id));
    }
  }

</script>
  <header class="topbar">
    <div>
      <h1>Student ID Card System</h1>
      <p>Student registration and printable ID generator</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="section-heading">
        <div>
          <h2>Admin Dashboard</h2>
          <p>Add students, manage records, and print IDs.</p>
        </div>
        <button class="primary" onclick="openForm()">+ Add Student</button>
      </div>
<div class="stats">
  <div class="stat"><span id="studentCount">0</span><small>Total Students</small></div>
</div>

<div class="toolbar">
  <input id="searchInput" type="search" placeholder="Search by name..." />
  <button onclick="openForm()" style="background:#2563eb; color:white; padding:10px 20px; border:none; border-radius:8px; cursor:pointer;">+ Add Student</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Photo</th>
        <th>Student ID</th>
        <th>Name</th>
        <th>Grade & Section</th>
        <th>School Year</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentTable"></tbody>
  </table>
</div>
</main></div>
    </section>
  </main>

  <div class="modal" id="studentModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="formTitle">Add Student</h2>
        <button class="icon-btn" onclick="closeForm()" aria-label="Close">&times;</button>
      </div>

      <form id="studentForm">
        <input type="hidden" id="editIndex">

        <div class="form-grid">
          <label>Student ID
            <input id="studentId" required placeholder="e.g. 2026-0001">
          </label>
          <label>Full Name
            <input id="fullName" required placeholder="Last Name, First Name, Middle Name">
          </label>
          <label>Grade Level
            <input id="grade" required placeholder="e.g. Grade 12">
          </label>
          <label>Section
            <input id="section" required placeholder="e.g. ICT-A">
          </label>
          <label>Birthday
            <input id="birthday" type="date">
          </label>
          <label>Contact Number
            <input id="contact" placeholder="09XXXXXXXXX">
          </label>
          <label>School Year
            <input id="schoolYear" required value="2026-2027">
          </label>
          <label>Adviser
            <input id="adviser" placeholder="Name of adviser">
          </label>
          <label class="full">Address
            <textarea id="address" rows="2" placeholder="Complete address"></textarea>
          </label>
          <label class="full">Student Photo
            <input id="photo" type="file" accept="image/*">
            <small>Use a clear portrait photo. The image is stored in this browser.</small>
          </label>
        </div>

        <div class="form-actions">
          <button type="button" class="secondary" onclick="closeForm()">Cancel</button>
          <button type="submit" class="primary">Save Student</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>

</body>
</body>
</html>
